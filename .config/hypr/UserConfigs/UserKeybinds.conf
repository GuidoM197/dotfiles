# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# bindd = $mainMod, E, file manager, exec, $files
# unbind = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME










bindd  = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume --limit 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindde = , XF86AudioRaiseVolume, Volume up repeat, exec, wpctl set-volume --limit 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindd  = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindde = , XF86AudioLowerVolume, Volume down repeat, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindd  = , XF86AudioMute, Toggle mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindd = $mainMod CTRL SHIFT, B, Restart display manager, exec, sudo systemctl restart display-manager
bindd = $mainMod, B, Open Brave browser, exec, brave --password-store=basic
bindd = ALT, SPACE, switch keyboard layout, exec, $scriptsDir/KeyboardLayout.sh switch
bindd = $mainMod, V, clipboard history, exec, $scriptsDir/ClipManager.sh
bindd = $mainMod ALT, S, Open Spotify, exec, spotify-launcher
bindd = $mainMod ALT, D, Open Discord, exec, discord

# TTY virtual terminal switching (SUPER+F1-F6 to avoid Aquamarine interception)
bind = SUPER, F1, exec, $scriptsDir/SwitchTTY.sh 1
bind = SUPER, F2, exec, $scriptsDir/SwitchTTY.sh 2
bind = SUPER, F3, exec, $scriptsDir/SwitchTTY.sh 3
bind = SUPER, F4, exec, $scriptsDir/SwitchTTY.sh 4
bind = SUPER, F5, exec, $scriptsDir/SwitchTTY.sh 5
bind = SUPER, F6, exec, $scriptsDir/SwitchTTY.sh 6

# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset
