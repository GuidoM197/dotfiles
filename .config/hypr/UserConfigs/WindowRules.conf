# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates


#  Optional Layer rules
#  To Resolve blurred corners in rofi  Uncomment
# layerrule = blur on, ignore_alpha 0, match:namespace rofi

windowrule = match:title ^(OpenCode)$, opacity 1.0 1.0

# Force full opacity on the focused (selected) window, keep per-tag inactive opacity
windowrule = match:tag browser, opacity 1.0 0.95
windowrule = match:tag projects, opacity 1.0 0.95
windowrule = match:tag im, opacity 1.0 0.95
windowrule = match:tag multimedia, opacity 1.0 0.95
windowrule = match:tag file-manager, opacity 1.0 0.95
windowrule = match:tag terminal, opacity 1.0 0.95
windowrule = match:tag settings, opacity 1.0 0.95
windowrule = match:tag viewer, opacity 1.0 0.95
windowrule = match:tag wallpaper, opacity 1.0 0.95
windowrule = match:class ^(gedit|org.gnome.TextEditor|mousepad)$, opacity 1.0 0.95
windowrule = match:class ^(deluge)$, opacity 1.0 0.95
windowrule = match:class ^(seahorse)$, opacity 1.0 0.95
windowrule = match:title ^(Picture-in-Picture)$, opacity 1.0 0.95




