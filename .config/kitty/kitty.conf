# /* ---- 💫 https://github.com/LinuxBeginnings 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/01-Wallust.conf

font_family FantasqueSansM Nerd Font Mono
font_size 16.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.55
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto
allow_remote_control yes

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background none

# foreground/background/cursor override — wallust deja el fondo bien,
# pero el foreground y los ANSI quedan muy apagados/monocromos para leer.
foreground #F5F0EE
background #0A0607

# ANSI: blanco fuerte para texto normal, colores distintos entre sí
# para que iconos/valores de fastfetch se puedan distinguir a simple vista.
color0  #2A2224
color1  #E8394C
color2  #6FCF8F
color3  #E0B33C
color4  #5B9BD5
color5  #C77DD6
color6  #4FC3D9
color7  #F5F0EE
color8  #6B5A5D
color9  #FF5C6C
color10 #8FE0AA
color11 #F2C94C
color12 #7DB8ED
color13 #E29CEB
color14 #6FD4E8
color15 #FFFFFF
